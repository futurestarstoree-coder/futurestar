<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! - FUTURESTAR</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .success-container {
            padding: 40px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #22e600;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-home {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            text-transform: uppercase;
            transition: background 0.3s;
        }
        .btn-home:hover {
            background-color: #22e600;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <h1>¡Pedido Confirmado!</h1>
        <p>Gracias por confiar en <strong>FUTURESTAR</strong>. Tu pago se ha procesado correctamente y ya estamos preparando tu prenda, En las próximas 24 horas hábiles te enviaremos tu número de guía por correo electrónico para que puedas rastrear tu paquete en todo momento.</p>
        <a href="index.html" class="btn-home">Volver a la tienda</a>
    </div>

</body>
</html>
